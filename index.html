<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Level — Student Profiles &amp; Video Analysis</title>
  <meta name="description" content="Next Level tennis player portal: high-speed video analysis, personal drill libraries, and frame-by-frame stroke breakdowns for active players.">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="home">

  <!-- Header slot (populated by app.js) -->
  <div id="site-header"></div>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="container">
      <h1 class="display hero__title">
        <span class="line"><span>SWING WITH</span></span>
        <span class="line"><span>CONFIDENCE</span></span>
      </h1>
      
      <div class="hero__media">
        <video id="hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="assets/media/hero-poster.jpg">
          <source src="assets/media/hero-loop.mp4" type="video/mp4">
        </video>
        
        <div class="hud" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
          <span class="hud__rec">ANALYSIS REC</span>
          <span class="hud__tc" id="hero-tc">00:00:00</span>
        </div>
        
        <div class="hero__bottom">
          <span class="display">ELEVATE YOUR GAME</span>
          <span class="hero__meta">Private Coaching · High-Speed Video Analysis · Custom Drills</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/media-manifest.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
